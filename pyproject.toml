[project]
name = "liteagents"
version = "0.1.0"
description = "Provider-independent agent SDK built on LiteLLM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.102.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.5.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<3"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/BerriAI/liteagents"
Repository = "https://github.com/BerriAI/liteagents"
Issues = "https://github.com/BerriAI/liteagents/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liteagents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = [
    "liteagents.compaction.*",
    "liteagents._internal.compaction_context",
    "liteagents._internal.compaction_runtime",
    "liteagents._internal.context_tokens",
    "liteagents._internal.validation",
    "liteagents.usage",
    "tests.typecheck.*",
]
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unused_ignores = true
